include classpath("application.conf")

# "*" faz a URL devolvida pelo GetQueueUrl seguir o host/porta da requisicao; com o host fixo ela viria com a
# porta interna do conteiner, que nao e a porta mapeada pelo Testcontainers.
node-address {
  host = "*"
}

queues {
  "execution-commands-dlq.fifo" {
    fifo = true
    contentBasedDeduplication = false
  }
  "billing-commands-dlq.fifo" {
    fifo = true
    contentBasedDeduplication = false
  }
  "os-saga-replies-dlq.fifo" {
    fifo = true
    contentBasedDeduplication = false
  }
  "execution-commands.fifo" {
    fifo = true
    contentBasedDeduplication = false
    deadLettersQueue {
      name = "execution-commands-dlq.fifo"
      maxReceiveCount = 3
    }
  }
  "billing-commands.fifo" {
    fifo = true
    contentBasedDeduplication = false
    deadLettersQueue {
      name = "billing-commands-dlq.fifo"
      maxReceiveCount = 3
    }
  }
  "os-saga-replies.fifo" {
    fifo = true
    contentBasedDeduplication = false
    defaultVisibilityTimeout = 1 second
    deadLettersQueue {
      name = "os-saga-replies-dlq.fifo"
      maxReceiveCount = 3
    }
  }
}
