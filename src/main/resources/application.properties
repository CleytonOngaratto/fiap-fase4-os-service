quarkus.application.name=car-workshop-api
quarkus.http.port=8080
quarkus.http.root-path=/carworkshop/v1

# Database — host e porta separados espelham o contrato SSM /fase4/rds/* (endpoint = host puro).
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:oficina_db}?sslmode=${DB_SSLMODE:disable}

# Hibernate
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=false

# Flyway
quarkus.flyway.enabled=true
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0.0.0

# OpenAPI
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
# Sem estes tres o documento sai com o titulo generico derivado do nome da aplicacao, e o Swagger UI
# e a referencia oficial da API entregue na Fase 3 — nao ha collection Postman separada.
quarkus.smallrye-openapi.info-title=Car Workshop API
quarkus.smallrye-openapi.info-version=3.0.0
quarkus.smallrye-openapi.info-description=Gestao de oficina mecanica. O cliente autentica-se por CPF no API Gateway (Lambda) e acompanha suas ordens de servico; as rotas administrativas exigem o papel ADMIN.

# Security / JWT
# Par RSA fora do classpath. Prod = Secret do k8s montado como volume; dev = ./secrets/.
# A app precisa das DUAS chaves: valida o token da Lambda e assina o token de admin.
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:file:./secrets/publicKey.pem}
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:file:./secrets/privateKey.pem}
# Mesmo issuer da Lambda de autenticacao por CPF (groups=["CUSTOMER"] + claim cpf).
mp.jwt.verify.issuer=https://oficina-api.com
mp.jwt.verify.groups.path=groups
quarkus.security.jaxrs.deny-unannotated-endpoints=false

# Observabilidade
quarkus.log.console.json.enabled=true
quarkus.log.console.json.additional-field."service.name".value=car-workshop-api
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.jvm=true
# JSON so vale a pena em container; no terminal atrapalha a leitura.
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false

# Test environment
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:db;DB_CLOSE_DELAY=-1;
%test.quarkus.hibernate-orm.dialect=org.hibernate.dialect.H2Dialect
%test.quarkus.hibernate-orm.schema-management.strategy=create-drop
%test.quarkus.hibernate-orm.sql-load-script=import-test.sql
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.http.port=9090
%test.quarkus.oidc.enabled=false
# Disable the background scheduler in tests so @Scheduled ticks don't race the
# manual invocation in DiagnosisSchedulerServiceTest (flaky TooManyActualInvocations).
%test.quarkus.scheduler.enabled=false

# JWT properties for test profile
# Par DESCARTAVEL em src/test/resources/, distinto do de producao: fixture, nao credencial.
%test.mp.jwt.verify.publickey.location=publicKey.pem
%test.smallrye.jwt.sign.key.location=privateKey.pem
%test.mp.jwt.verify.issuer=https://oficina-api.com
