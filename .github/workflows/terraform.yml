name: Terraform - OS Service (RDS + target group + regra no ALB interno)

# Sem filtro de caminho no pull_request: workflow pulado por filtro deixa o check obrigatório "Pending" e trava o merge.
on:
  pull_request:
    branches: [ "main" ]
  # O push na main aplica: sem este filtro, um merge só de código ou docs subiria de novo a infraestrutura do serviço.
  push:
    branches: [ "main" ]
    paths: [ "terraform/**", ".github/workflows/terraform.yml" ]
  workflow_dispatch:
    inputs:
      action:
        description: "O que executar"
        type: choice
        required: true
        default: plan
        options: [ plan, apply, destroy ]

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_STATE_KEY: os-service/terraform.tfstate
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

jobs:
  fmt-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.4
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init (sem backend)
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate

  terraform:
    needs: fmt-validate
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: terraform

    # No job, não no workflow: um apply em curso não pode enfileirar nem cancelar o fmt-validate de um PR.
    # Sem cancel-in-progress: abortar um apply no meio deixa recursos fora do state.
    concurrency:
      group: terraform-os-service
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # Só funciona logo após o configure-aws-credentials: com token expirado ele falha antes de qualquer outro step.
      - name: Lab session expirada?
        if: failure()
        run: |
          echo "::error::Credencial do AWS Academy expirou ou esta invalida (a sessao dura ~4h)."
          echo "::error::Abra o lab, atualize ~/.aws/credentials e rode, no repo de plataforma:"
          echo "::error::  fiap-fase4-infra-k8s/scripts/refresh-gh-secrets.ps1 -Org CleytonOngaratto"
          echo "::error::O AWS_SESSION_TOKEN e obrigatorio; sem ele o erro vem como InvalidClientTokenId."

      - name: Check lab session
        run: aws sts get-caller-identity

      - name: Check repository variables
        run: |
          if [ -z "$TF_STATE_BUCKET" ]; then
            echo "::error::Repository variable TF_STATE_BUCKET nao definida (valor: o bucket criado pelo bootstrap-backend.ps1 da plataforma)."
            echo "::error::Settings > Secrets and variables > Actions > Variables (NAO e um secret)."
            exit 1
          fi

      - name: Check platform contract (SSM)
        run: |
          set -euo pipefail
          missing=0
          for p in /fase4/vpc/id /fase4/vpc/private-subnets /fase4/eks/node-sg-id /fase4/alb/listener-arn; do
            if ! aws ssm get-parameter --name "$p" > /dev/null 2>&1; then
              echo "::error::Parametro ausente no SSM: $p - quem publica: fiap-fase4-infra-k8s"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "::error::Ordem de deploy: plataforma -> infra dos servicos -> deploy dos servicos -> borda."
            echo "::error::No destroy a plataforma tem de estar de pe: os data sources leem estes parametros."
            exit 1
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.4
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: github.event_name != 'workflow_dispatch' || inputs.action != 'destroy'
        run: |
          terraform plan -no-color -out=tfplan | tee plan.txt
          {
            echo "### Terraform plan"
            echo '```'
            tail -n 60 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
        run: terraform apply -auto-approve tfplan

      - name: Terraform destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: terraform destroy -auto-approve

      - name: Show outputs
        if: success() && github.event_name != 'pull_request'
        run: terraform output || true
