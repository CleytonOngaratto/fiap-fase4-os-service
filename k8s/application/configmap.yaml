apiVersion: v1
kind: ConfigMap
metadata:
  name: car-workshop-api-config
  namespace: os
  labels:
    app: car-workshop-api
data:
  QUARKUS_HTTP_HOST: "0.0.0.0"
  QUARKUS_HTTP_ROOT_PATH: /carworkshop/v1
  QUARKUS_FLYWAY_MIGRATE_AT_START: "true"
  QUARKUS_LOG_LEVEL: INFO

  # Sem QUARKUS_DATASOURCE_JDBC_URL: ela sobrescreveria a URL montada aqui e o sslmode=require sumiria calado.
  DB_SSLMODE: require

  JWT_PUBLIC_KEY_LOCATION: file:/deployments/secrets/publicKey.pem
  JWT_PRIVATE_KEY_LOCATION: file:/deployments/secrets/privateKey.pem

  # Trocados no deploy pelo cd.yml; aplicados crus, o relay e o consumidor sobem sem fila.
  EXECUTION_COMMANDS_QUEUE_URL: __EXECUTION_COMMANDS_QUEUE_URL__
  BILLING_COMMANDS_QUEUE_URL: __BILLING_COMMANDS_QUEUE_URL__
  SAGA_REPLIES_QUEUE_URL: __SAGA_REPLIES_QUEUE_URL__

  SAGA_APPROVAL_DEADLINE: PT48H
  SAGA_PAYMENT_DEADLINE: PT30M
  SAGA_DEADLINE_SCAN_INTERVAL: 30s
