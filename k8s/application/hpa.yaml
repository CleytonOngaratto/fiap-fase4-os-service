apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: car-workshop-api
  namespace: car-workshop
  labels:
    app: car-workshop-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: car-workshop-api
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
