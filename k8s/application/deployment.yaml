# 🔴 `kubectl apply -f k8s/application/` não serve para este arquivo: `image:` é o placeholder
# __IMAGE__, que o scripts/deploy.ps1 troca pela URL do ECR (carrega o account id e muda a cada
# sessão do lab). Aplicado cru, o pod entra em ImagePullBackOff tentando puxar "__IMAGE__".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: car-workshop-api
  namespace: car-workshop
  labels:
    app: car-workshop-api
spec:
  # Piso; o HPA assume o número real depois.
  replicas: 2
  selector:
    matchLabels:
      app: car-workshop-api
  template:
    metadata:
      labels:
        app: car-workshop-api
      # `newrelic.io/scrape` e não `prometheus.io/scrape`: o job default do agente só aceita uma
      # allowlist de nomes conhecidos e ignoraria a app em silêncio. Porta e path são obrigatórios —
      # o default do agente é 9102, e o root-path do Quarkus move o endpoint.
      annotations:
        newrelic.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/carworkshop/v1/q/metrics"
    spec:
      # fsGroup é o que torna o volume do JWT legível: arquivo de volume de Secret nasce root:root,
      # e sem ele os PEMs em 0440 ficam ilegíveis pelo uid 1001 — a app quebra no boot com um erro
      # de chave que parece PEM corrompido.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: car-workshop-api
          image: __IMAGE__
          # A tag é o SHA do commit, então o pull real acontece quando a tag muda; Always cobre o
          # caso de a mesma tag ter sido republicada no ECR.
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          # Os dois Secrets são gerados do SSM pelo deploy.ps1; nenhum é versionado. A license key do
          # New Relic é opcional: ausente, a var não chega ao pod e o agente não sobe.
          envFrom:
            - configMapRef:
                name: car-workshop-api-config
            - secretRef:
                name: car-workshop-db
            - secretRef:
                name: car-workshop-app
          # Chave RSA por volume, não env var. Em env var ela apareceria no `kubectl describe
          # pod`, seria herdada por todo processo filho e entraria na captura de ambiente do agente
          # New Relic.
          volumeMounts:
            - name: jwt-keys
              mountPath: /deployments/secrets
              readOnly: true
          # A startupProbe segura liveness e readiness durante o boot lento (Quarkus + Flyway), o que
          # evita o restart em loop por liveness timeout no cold start.
          startupProbe:
            httpGet:
              path: /carworkshop/v1/q/health/live
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          # /live e não /ready: readiness inclui o check do banco, e um blip do RDS reiniciaria
          # TODOS os pods.
          livenessProbe:
            httpGet:
              path: /carworkshop/v1/q/health/live
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /carworkshop/v1/q/health/ready
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              # 🔴 requests.cpu é obrigatório: o HPA calcula o % sobre o request. Sem ele fica
              # <unknown>/60% e nunca escala.
              cpu: 200m
              # 896Mi vem da aritmética do HPA, não do consumo (o pod usa ~350Mi). Como
              # desired = ceil(replicas × utilização/target), descer de n para n−1 exige utilização
              # abaixo de target × (n−1)/n — 53%, não 80%. Com 512Mi o pod ficava em 68%: abaixo do
              # alvo e mesmo assim travado, que é o que o 4c não viu. Dimensionado com o heap cheio
              # (220Mi de não-heap + 25% do limite): 49,6% aqui, 53,6% com 768Mi — que ainda trava.
              memory: 896Mi
            limits:
              cpu: 500m
              # Igual ao request (QoS Guaranteed). O limite é o teto do heap da JVM
              # (MaxRAMPercentage 25%), então mexer aqui refaz a conta acima.
              memory: 896Mi
      volumes:
        - name: jwt-keys
          secret:
            secretName: car-workshop-jwt
            # 0440 + fsGroup 1001: legível pelo grupo da app, por ninguém mais.
            defaultMode: 0440
