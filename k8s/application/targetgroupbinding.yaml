apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: car-workshop-api
  namespace: os
  labels:
    app: car-workshop-api
spec:
  targetType: ip
  targetGroupARN: __TARGET_GROUP_ARN__
  serviceRef:
    name: car-workshop-api
    port: 80
  networking:
    ingress:
      - from:
          - securityGroup:
              groupID: __ALB_SG_ID__
        ports:
          - port: 8080
            protocol: TCP
