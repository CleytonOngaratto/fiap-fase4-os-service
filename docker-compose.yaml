services:
  oficina_app:
    build:
      context: .
      dockerfile: Dockerfile
    image: car-workshop-api:local
    container_name: oficina_app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: oficina_db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-oficina_db}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_SSLMODE: disable
      SECRET_KEY: ${SECRET_KEY:-oficina-secret-key-dev}
      JWT_PUBLIC_KEY_LOCATION: file:/deployments/secrets/publicKey.pem
      JWT_PRIVATE_KEY_LOCATION: file:/deployments/secrets/privateKey.pem
      # Sem valor: repassa do ambiente e omite se ausente; ${VAR:-} mandaria vazio, que o agente trata diferente.
      NEW_RELIC_LICENSE_KEY:
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME:-car-workshop-api-local}
      # A imagem roda com o perfil de producao: endpoint, credencial e filas vem por env, nao pelo %dev.
      QUARKUS_SQS_ENDPOINT_OVERRIDE: http://oficina_mq:9324
      QUARKUS_SQS_AWS_CREDENTIALS_TYPE: static
      QUARKUS_SQS_AWS_CREDENTIALS_STATIC_PROVIDER_ACCESS_KEY_ID: elasticmq
      QUARKUS_SQS_AWS_CREDENTIALS_STATIC_PROVIDER_SECRET_ACCESS_KEY: elasticmq
      EXECUTION_COMMANDS_QUEUE_URL: http://oficina_mq:9324/000000000000/execution-commands.fifo
      BILLING_COMMANDS_QUEUE_URL: http://oficina_mq:9324/000000000000/billing-commands.fifo
      SAGA_REPLIES_QUEUE_URL: http://oficina_mq:9324/000000000000/os-saga-replies.fifo
    volumes:
      - ./secrets:/deployments/secrets:ro
    depends_on:
      oficina_db:
        condition: service_healthy
      oficina_mq:
        condition: service_started

  oficina_db:
    image: postgres:16
    container_name: oficina_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-oficina_db}
    ports:
      - "${DB_PORT_HOST:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-oficina_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  oficina_mq:
    image: softwaremill/elasticmq-native:1.7.1
    container_name: oficina_mq
    ports:
      - "${MQ_PORT_HOST:-9324}:9324"
    volumes:
      - ./docker/elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro

  sonarqube:
    image: sonarqube:10.4.1-community
    container_name: oficina_sonar
    profiles: ["sonar"]
    ports:
      - "9000:9000"
    environment:
      - SONAR_FORCEAUTHENTICATION=false
    volumes:
      - sonarqube_data:/opt/sonarqube/data

volumes:
  postgres_data:
  sonarqube_data:
