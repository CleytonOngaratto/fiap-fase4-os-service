services:
  oficina_app:
    build:
      context: .
      dockerfile: Dockerfile
    image: car-workshop-api:local
    container_name: oficina_app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: oficina_db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-oficina_db}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_SSLMODE: disable
      SECRET_KEY: ${SECRET_KEY:-oficina-secret-key-dev}
      JWT_PUBLIC_KEY_LOCATION: file:/deployments/secrets/publicKey.pem
      JWT_PRIVATE_KEY_LOCATION: file:/deployments/secrets/privateKey.pem
      # Sem valor: repassa do ambiente e omite se ausente; ${VAR:-} mandaria vazio, que o agente trata diferente.
      NEW_RELIC_LICENSE_KEY:
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME:-car-workshop-api-local}
    volumes:
      - ./secrets:/deployments/secrets:ro
    depends_on:
      oficina_db:
        condition: service_healthy

  oficina_db:
    image: postgres:16
    container_name: oficina_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-oficina_db}
    ports:
      - "${DB_PORT_HOST:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-oficina_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  sonarqube:
    image: sonarqube:10.4.1-community
    container_name: oficina_sonar
    profiles: ["sonar"]
    ports:
      - "9000:9000"
    environment:
      - SONAR_FORCEAUTHENTICATION=false
    volumes:
      - sonarqube_data:/opt/sonarqube/data

volumes:
  postgres_data:
  sonarqube_data:
